spring:
  profiles:
    active: dev
  application:
    name: yunya-auth
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always
  redis:
    database: 2
    host: localhost
    port: 6379
    pool:
    max-active: 20
  datasource:
    host: 47.99.146.90
    port: 3306
    name: yunya_system
    url: jdbc:mysql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.name}?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false
    username: root
    password: 123456
    # 使用druid数据源
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.jdbc.Driver
    filters: stat
    maxActive: 20
    initialSize: 1
    maxWait: 60000
    minIdle: 1
    timeBetweenEvictionRunsMillis: 60000
    minEvictableIdleTimeMillis: 300000
    validationQuery: select 'x'
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true
    maxOpenPreparedStatements: 20
#  rabbitmq:
#    host: localhost
#    port:  5672
#    username: guest
#    password: guest
#  sleuth:
#    enabled: true
#    http:
#      legacy:
#        enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: 47.99.146.90:8849
    sentinel:
      transport:
        dashboard: localhost:8080
sample:
  zipkin:
    # When enabled=false, traces log to the console. Comment to send to zipkin
    enabled: false

mybatis:
  basepackage: com.yunya.auth.mapper
  xmlLocation: classpath:mapper/**/*.xml
  mapper-locations: "classpath*:mapper/*.xml"

server:
  port: 8777 #启动端口

feign:
  httpclient:
    enabled: false
  okhttp:
    enabled: true

ribbon:
  eureka:
    enabled: true
  ReadTimeout: 60000
  ConnectTimeout: 60000
  MaxAutoRetries: 0
  MaxAutoRetriesNextServer: 1
  OkToRetryOnAllOperations: false

hystrix:
  threadpool:
    default:
      #并发执行的最大线程数，默认10
      coreSize: 1000
      #BlockingQueue的最大队列数
      maxQueueSize: 1000
      #即使maxQueueSize没有达到，达到queueSizeRejectionThreshold该值后，请求也会被拒绝
      queueSizeRejectionThreshold: 500
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 10000

jwt:
  token-header: Authorization
  expire: 14400
  rsa-secret: xx1WET12^%3^(WE45

#auth:
#  user:
#    token-header: Authorization
#  client:
#    id: yunya-auth
#    secret: 123456

logging:
  level:
    # tk.mybatis: DEBUG
    com.yunya.auth: DEBUG

# 暴露所有端点
management:
  endpoints:
    web:
      exposure:
        include: '*'
  security:
    enabled: false
