logging:
  level:
    root: DEBUG
    tk.mybatis: DEBUG
    com.yunya: DEBUG
    com.yunya365: DEBUG

server:
  port: 8211

codeUrl:
  url: http://192.168.31.95:8080/mobile

cardSold:
  selfChannel: 艾维自有

spring:
  application:
    name: yunya-discount
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always
  datasource:
    host: 192.168.31.90
    port: 3306
    username: sa
    password: Admin001!
    name: dev_yunya_discount
    url: jdbc:mysql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.name}?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false
    driver-class-name: com.mysql.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  redis:
    host: 192.168.31.90
    port: 6379
    password: foobared
    database: 2
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.31.215:8848
  zipkin:
    discovery-client-enabled: false
  profiles:
    active: dev

mybatis:
  mapperLocations: classpath:mapper/*Mapper.xml
  type-aliases-package: com.yunya.models.discount
  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名
    map-underscore-to-camel-case: true
# 必须配置
feign:
  httpclient:
    enabled: false
  okhttp:
    enabled: true
  client:
    config:
      default:
        loggerLevel: basic
        requestInterceptors: com.yunya.framework.common.interceptor.FeignBasicAuthRequestInterceptor

# 负载均衡
ribbon:
  eureka:
    enabled: true
  ReadTimeout: 100000
  ConnectTimeout: 100000
  MaxAutoRetries: 0
  MaxAutoRetriesNextServer: 1
  OkToRetryOnAllOperations: false

# 配置swagger
swagger:
  enabled: true
  base-package: com.yunya.modules.discount
  title: 系统卡券服务
  version: 1.0.0.SNAPSHOT
  description: YUNYA系统卡券服务 (网关地址：/api/discount/**)
  contact:
    name: yunya-discount

# 熔断
hystrix:
  threadpool:
    default:
      coreSize: 1000 #并发执行的最大线程数，默认10
      maxQueueSize: 1000 #BlockingQueue的最大队列数
      queueSizeRejectionThreshold: 500 #即使maxQueueSize没有达到，达到queueSizeRejectionThreshold该值后，请求也会被拒绝
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 110000
