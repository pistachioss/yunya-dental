server:
  port: 8111

spring:
  application:
    name: clinic-discount
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://192.168.31.90:3306/yunya_discount?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false
    username: sa
    password: Admin001!
  redis:
    host: 192.168.31.90
    port: 6379
    password: foobared
    database: 2
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.31.215:8848
  zipkin:
    discovery-client-enabled: false

mybatis:
  mapperLocations: classpath:mapper/*Mapper.xml
  type-aliases-package: com.yunya.models.discount
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 必须配置
feign:
  httpclient:
    enabled: false
  okhttp:
    enabled: true

# 负载均衡
ribbon:
  eureka:
    enabled: true
  ReadTimeout: 100000
  ConnectTimeout: 100000
  MaxAutoRetries: 0
  MaxAutoRetriesNextServer: 1
  OkToRetryOnAllOperations: false

# 配置swagger
swagger:
  enabled: true
  base-package: com.yunya.modules.discount
  title: 系统卡券服务
  version: 1.0.0.SNAPSHOT
  description: YUNYA系统卡券服务
  contact:
    name: yunya-discount

# 熔断
hystrix:
  threadpool:
    default:
      coreSize: 1000 #并发执行的最大线程数，默认10
      maxQueueSize: 1000 #BlockingQueue的最大队列数
      queueSizeRejectionThreshold: 500 #即使maxQueueSize没有达到，达到queueSizeRejectionThreshold该值后，请求也会被拒绝
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 110000

