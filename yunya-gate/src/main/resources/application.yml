server:
  port: 8765

#请求和响应GZIP压缩支持
feign:
  httpclient:
    enabled: false
  okhttp:
    enabled: true
  compression:
    request:
      enabled: true
      mime-types: text/xml,application/xml,application/json
      min-request-size: 2048
    response:
      enabled: true

spring:
  application:
    name: yunya-gateway
  redis:
    database: 2
    host: 192.168.31.90
    jedis:
      pool:
        max-active: 20
    port: 6379
    password: foobared

  #  rabbitmq:
  #    host: ${RABBIT_MQ_HOST:localhost}
  #    port:  ${RABBIT_MQ_PORT:5672}
  #    username: guest
  #    password: guest
  #  sleuth:
  #    enabled: true
  #    http:
  #      legacy:
  #        enabled: true
  cloud:
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        # ==================网关路由配置（新增服务按照样例配置路由即可）===================
        - id: yunya-auth
          uri: lb://yunya-auth
          order: 8000
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
          metadata:
            title: "权限认证服务"
        - id: yunya-system
          uri: lb://yunya-system
          order: 8001
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=2
          metadata:
            title: "系统基础服务"
        - id: yunya-employee-expand
          uri: lb://yunya-employee-expand
          order: 8004
          predicates:
            - Path=/api/employee/expand/**
          filters:
            - StripPrefix=3
          metadata:
            title: "员工个人服务"
        - id: yunya-emr
          uri: lb://yunya-emr
          order: 8005
          predicates:
            - Path=/api/emr/**
          filters:
            - StripPrefix=2
          metadata:
            title: "电子病历服务"
        - id: yunya-employee-attend
          uri: lb://yunya-employee-attend
          order: 8006
          predicates:
            - Path=/api/employee/attend/**
          filters:
            - StripPrefix=3
          metadata:
            title: "排班考勤服务"
        - id: yunya-appointment-central
          uri: lb://yunya-appointment-central
          order: 9001
          predicates:
            - Path=/api/appointment/**
          filters:
            - StripPrefix=2
          metadata:
            title: "预约服务"
        - id: yunya-patient
          uri: lb://yunya-patient
          order: 9002
          predicates:
            - Path=/api/patient/**
          filters:
            - StripPrefix=2
          metadata:
            title: "患者资料服务"
        - id: yunya-treatment
          uri: lb://yunya-treatment
          order: 9004
          predicates:
            - Path=/api/treatment/**
          filters:
            - StripPrefix=2
          metadata:
            title: "诊疗服务"
        - id: yunya-discount
          uri: lb://yunya-discount
          order: 9005
          predicates:
            - Path=/api/discount/**
          filters:
            - StripPrefix=2
          metadata:
            title: "卡券服务"
        - id: yunya-treatment-other
          uri: lb://yunya-treatment-other
          order: 9000
          predicates:
            - Path=/api/treatment/other/**
          filters:
            - StripPrefix=3
          metadata:
            title: "就诊扩展服务"
        - id: yunya-clinic-base
          uri: lb://yunya-clinic-base
          order: 9006
          predicates:
            - Path=/api/clinic/base/**
          filters:
            - StripPrefix=3
          metadata:
            title: "结算统计服务"
        - id: yunya-report-ultimate
          uri: lb://yunya-report-ultimate
          order: 9007
          predicates:
            - Path=/api/report/ultimate/**
          filters:
            - StripPrefix=3
          metadata:
            title: "系统报表服务"
  
  
        # 通用工具服务，编号后排
        - id: aliyun-oss
          uri: lb://aliyun-oss
          order: 8999
          predicates:
            - Path=/api/aliyunoss/**
          filters:
            - StripPrefix=2
          metadata:
            title: "资源图片服务"

        - id: rabbit-mq
          uri: lb://rabbit-mq
          order: 8998
          predicates:
            - Path=/api/rabbitmq/**
          filters:
            - StripPrefix=2
          metadata:
            title: "系统消息服务"
    nacos:
      discovery:
        server-addr: 192.168.31.215:8848
    sentinel:
      transport:
        dashboard: localhost:8080
logging:
  level:
    com.yunya.gate: info

# 暴露所有端点
management:
  endpoints:
    web:
      exposure:
        include: '*'
  security:
    enabled: false

# 忽略网关鉴权的请求路径
gate:
  ignore:
    startWith: /auth/jwt,/v2/api-docs,/callback/,/central/paizhaohuidiao,/*/permit/

auth:
  serviceId: yunya-auth
  user:
    token-header: Authorization
  client:
    id: yunya-gate  #不填则默认读取spring.application.name
    secret: 123456

# 负载均衡
ribbon:
  eureka:
    enabled: true
  ReadTimeout: 60000
  ConnectTimeout: 60000
  MaxAutoRetries: 0
  MaxAutoRetriesNextServer: 1
  OkToRetryOnAllOperations: false

hystrix:
  threadpool:
    default:
      #并发执行的最大线程数，默认10
      coreSize: 1000
      #BlockingQueue的最大队列数
      maxQueueSize: 1000
      #即使maxQueueSize没有达到，达到queueSizeRejectionThreshold该值后，请求也会被拒绝
      queueSizeRejectionThreshold: 500
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 10000