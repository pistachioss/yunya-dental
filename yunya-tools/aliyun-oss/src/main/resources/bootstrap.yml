spring:
    application:
        name: aliyun-oss
    cloud:
        nacos:
            config:
                server-addr: 192.168.100.80:8848
                file-extension: yaml
    profiles:
        active: dev
    main:
        allow-bean-definition-overriding: true

# 配置swagger
swagger:
    enabled: true
    base-package: com.yunya365.aliyunoss
    title: aliyun-oss
    version: 0.0.1.SNAPSHOT
    description: 资源OSS公共服务 （通过路由访问的路径：api/aliyunoss/）
    contact:
        name: aliyun-oss

logging:
    level:
        io.swagger.models.parameters.AbstractSerializableParameter: error



auth:
    serviceId: yunya-auth
    user:
        token-header: Authorization
    client:
        id: aliyun-oss
        secret: 123456
        token-header: x-client-token