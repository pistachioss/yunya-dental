logging:
  level:
    root: info
    com.yunya: info
    com.yunya365.mini: info

server:
  port: 8764

corn:
  order:
    confirm: 00 00 10 * * ?
    appointConfim: 00 00 9,12 * * ?

spring:
  application:
    name: ivy-mini
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always
  datasource:
    host: 192.168.31.90
    port: 3306
    username: sa
    password: Admin001!
    name: dev_yunya_mall
    url: jdbc:mysql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.name}?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false
    driver-class-name: com.mysql.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  zipkin:
    discovery-client-enabled: false
  profiles:
    active: dev

mybatis:
  mapperLocations: classpath:mapper/*Mapper.xml
  type-aliases-package: com.yunya.models.mini
  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名
    map-underscore-to-camel-case: true
mybatis-plus:
  mapper-locations: classpath:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 必须配置
feign:
  httpclient:
    enabled: false
  okhttp:
    enabled: true
#  client:
#    config:
#      default:
#        loggerLevel: basic
#        requestInterceptors: com.yunya.framework.common.interceptor.FeignBasicAuthRequestInterceptor

# 负载均衡
ribbon:
  eureka:
    enabled: true
  ReadTimeout: 100000
  ConnectTimeout: 100000
  MaxAutoRetries: 0
  MaxAutoRetriesNextServer: 1
  OkToRetryOnAllOperations: false

# 配置swagger
swagger:
  enabled: true
  base-package: com.yunya365.mini
  title: 小程序服务
  version: 1.0.0.SNAPSHOT
  description: YUNYA小程序服务 (网关地址：/api/ivy/mini/**)
  contact:
    name: ivy-mini

# 熔断
hystrix:
  threadpool:
    default:
      coreSize: 1000 #并发执行的最大线程数，默认10
      maxQueueSize: 1000 #BlockingQueue的最大队列数
      queueSizeRejectionThreshold: 500 #即使maxQueueSize没有达到，达到queueSizeRejectionThreshold该值后，请求也会被拒绝
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 110000
